<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Create game</title>
<desc id="desc">Host chooses a nickname, a single mission pack source and game settings (defaults pre-selected), then creates the lobby.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Create game</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><text x="20" y="126" font-size="12" font-weight="600" fill="#777777">YOUR NICKNAME</text><rect x="20" y="134" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="161" font-size="15" fill="#222222">Sam</text><text x="20" y="198" font-size="12" fill="#777777">Only for this game. Fixed once the game is created.</text><text x="20" y="232" font-size="11" font-weight="700" fill="#777777">MISSION PACK (ONE PER GAME)</text><rect x="20" y="244" width="350" height="36" rx="10" fill="#F4F4F4" stroke="#BBBBBB"/><rect x="23" y="247" width="110.66666666666667" height="30" rx="8" fill="#333333"/><text x="78.33333333333334" y="267" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Built-in</text><text x="195.00000000000003" y="267" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">My packs</text><text x="311.6666666666667" y="267" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Blank</text><rect x="20" y="292" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><circle cx="42" cy="318" r="9" fill="none" stroke="#222222" stroke-width="1.5"/><circle cx="42" cy="318" r="5" fill="#222222"/><text x="62" y="315" font-size="15" font-weight="600" fill="#222222">Example social pack</text><text x="62" y="333" font-size="12" fill="#777777">8 missions</text><rect x="20" y="352" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="42" cy="378" r="9" fill="none" stroke="#222222" stroke-width="1.5"/><text x="62" y="375" font-size="15" font-weight="600" fill="#222222">Party classics</text><text x="62" y="393" font-size="12" fill="#777777">40 missions</text><rect x="20" y="412" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="42" cy="438" r="9" fill="none" stroke="#222222" stroke-width="1.5"/><text x="62" y="435" font-size="15" font-weight="600" fill="#222222">Office safe</text><text x="62" y="453" font-size="12" fill="#777777">30 missions</text><rect x="20" y="476" width="350" height="108" rx="10" fill="#F4F4F4" stroke="#BBBBBB"/><text x="34" y="500" font-size="14" font-weight="700" fill="#222222">This game gets its own copy</text><text x="34" y="518" font-size="12" fill="#444444"><tspan x="34" dy="0">You can edit the copy until you start. It freezes</tspan><tspan x="34" dy="16">when the game starts.</tspan></text><rect x="34" y="542" width="150" height="32" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="109" y="563" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Edit pack copy</text><text x="20" y="604" font-size="11" font-weight="700" fill="#777777">GAME SETTINGS</text><rect x="20" y="614" width="350" height="56" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="636" font-size="14" font-weight="600" fill="#222222">Game settings</text><text x="34" y="654" font-size="12" fill="#777777">5 slots · 5m doubling · anon board</text><text x="338" y="647" font-size="13" font-weight="600" fill="#444444" text-anchor="end">Defaults</text><text x="356" y="648" font-size="20" fill="#222222" text-anchor="end">›</text><rect x="20" y="684" width="350" height="78" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="699" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="715" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">My packs lists private packs saved on this device;</tspan><tspan x="32" dy="16">Blank opens an empty draft. Settings start on</tspan><tspan x="32" dy="16">defaults and stay editable until Start.</tspan></text><rect x="20" y="778" width="350" height="48" rx="10" fill="#333333" stroke="#333333"/><text x="195" y="807" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Create game</text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
</svg>
