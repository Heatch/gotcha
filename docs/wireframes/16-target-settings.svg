<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Target settings</title>
<desc id="desc">Repeat rule for who can be named on a success: cycle everyone, X different in blocks, X different sliding, or no restriction.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Targets</text><rect x="324" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="347" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Done</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><text x="20" y="126" font-size="14" fill="#444444">Who can you name as the person you got?</text><rect x="20" y="142" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><circle cx="42" cy="168" r="9" fill="none" stroke="#222222" stroke-width="1.5"/><circle cx="42" cy="168" r="5" fill="#222222"/><text x="62" y="165" font-size="15" font-weight="600" fill="#222222">Cycle everyone</text><text x="62" y="183" font-size="12" fill="#777777">Get every player once, then start again</text><rect x="20" y="202" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="42" cy="228" r="9" fill="none" stroke="#222222" stroke-width="1.5"/><text x="62" y="225" font-size="15" font-weight="600" fill="#222222">X different, then reset</text><text x="62" y="243" font-size="12" fill="#777777">Blocks: hit X people, then the list clears</text><rect x="20" y="262" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="42" cy="288" r="9" fill="none" stroke="#222222" stroke-width="1.5"/><text x="62" y="285" font-size="15" font-weight="600" fill="#222222">Not your last X targets</text><text x="62" y="303" font-size="12" fill="#777777">Sliding: your last X cannot repeat</text><rect x="20" y="322" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="42" cy="348" r="9" fill="none" stroke="#222222" stroke-width="1.5"/><text x="62" y="345" font-size="15" font-weight="600" fill="#222222">No restriction</text><text x="62" y="363" font-size="12" fill="#777777">Anyone except yourself</text><rect x="20" y="394" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="416" font-size="14" font-weight="600" fill="#222222">X (different players)</text><text x="34" y="434" font-size="12" fill="#777777">Shown only for the two X rules</text><rect x="246" y="404" width="112" height="32" rx="8" fill="#FFFFFF" stroke="#222222"/><line x1="280" y1="404" x2="280" y2="436" stroke="#BBBBBB"/><line x1="324" y1="404" x2="324" y2="436" stroke="#BBBBBB"/><text x="263" y="426" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">−</text><text x="302" y="425" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">3</text><text x="341" y="426" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">+</text><text x="20" y="474" font-size="11" font-weight="700" fill="#777777">EXAMPLE · NOT YOUR LAST 3</text><rect x="20" y="484" width="118" height="34" rx="17" fill="#FFFFFF" stroke="#BBBBBB" stroke-dasharray="4 3"/><text x="79" y="506" font-size="13" font-weight="600" fill="#777777" text-anchor="middle">Lee · recent</text><rect x="146" y="484" width="118" height="34" rx="17" fill="#FFFFFF" stroke="#BBBBBB" stroke-dasharray="4 3"/><text x="205" y="506" font-size="13" font-weight="600" fill="#777777" text-anchor="middle">Ari · recent</text><rect x="20" y="528" width="111" height="34" rx="17" fill="#FFFFFF" stroke="#BBBBBB" stroke-dasharray="4 3"/><text x="75.5" y="550" font-size="13" font-weight="600" fill="#777777" text-anchor="middle">Jo · recent</text><rect x="139" y="528" width="51" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="164.5" y="550" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Kim</text><rect x="198" y="528" width="51" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="223.5" y="550" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Max</text><text x="20" y="584" font-size="12" fill="#444444"><tspan x="20" dy="0">Lee, Ari and Jo were your last 3 targets, so only Kim</tspan><tspan x="20" dy="16">or Max count now.</tspan></text><rect x="20" y="626" width="350" height="94" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="641" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="657" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Group is allowed only for missions marked Group OK</tspan><tspan x="32" dy="16">in the pack and never counts toward these rules.</tspan><tspan x="32" dy="16">Sliding X is capped at players minus one. Locked</tspan><tspan x="32" dy="16">once the game starts.</tspan></text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
</svg>
