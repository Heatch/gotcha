<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Join game</title>
<desc id="desc">Enter a game code and a nickname unique in that game; shows a nickname-taken error.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Join game</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><text x="20" y="136" font-size="14" fill="#444444">Ask your host for the game code.</text><text x="20" y="170" font-size="12" font-weight="600" fill="#777777">GAME CODE</text><rect x="20" y="178" width="350" height="56" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="211" font-size="15" fill="#222222">K7Q2 M9XA</text><text x="356" y="214" font-size="13" font-weight="600" fill="#222222" text-anchor="end">Paste</text><text x="20" y="266" font-size="12" font-weight="600" fill="#777777">NICKNAME</text><rect x="20" y="274" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="34" y="301" font-size="15" fill="#222222">sam</text><text x="20" y="338" font-size="12" font-weight="600" fill="#222222">&quot;Sam&quot; is already taken in this game. Try another.</text><text x="20" y="358" font-size="12" fill="#777777"><tspan x="20" dy="0">Unique in this game, not case-sensitive. Fixed after</tspan><tspan x="20" dy="16">joining.</tspan></text><rect x="20" y="396" width="350" height="94" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="411" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="427" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">You can join a game in its lobby or while it is</tspan><tspan x="32" dy="16">already active. Late joiners pick from missions</tspan><tspan x="32" dy="16">still left in the pack, so a hand may stay partly</tspan><tspan x="32" dy="16">empty.</tspan></text><rect x="20" y="494" width="350" height="78" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="509" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="525" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Other errors use the same inline pattern: code not</tspan><tspan x="32" dy="16">found, game ended, game expired, offline (joining</tspan><tspan x="32" dy="16">needs a connection).</tspan></text><rect x="20" y="770" width="350" height="48" rx="10" fill="#333333" stroke="#333333"/><text x="195" y="799" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Join game</text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
</svg>
