20" y="344" width="350" height="42" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="42" cy="365" r="11" fill="#E6E6E6"/><text x="62" y="370" font-size="14" font-weight="600" fill="#222222">Lee</text><rect x="20" y="392" width="350" height="42" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="42" cy="413" r="11" fill="#E6E6E6"/><text x="62" y="418" font-size="14" font-weight="600" fill="#222222">Ari</text><rect x="20" y="440" width="350" height="42" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="42" cy="461" r="11" fill="#E6E6E6"/><text x="62" y="466" font-size="14" font-weight="600" fill="#222222">Jo</text><text x="20" y="504" font-size="11" font-weight="700" fill="#777777">PACK</text><rect x="20" y="514" width="350" height="56" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="538" font-size="14" font-weight="600" fill="#222222">Example social pack</text><text x="34" y="556" font-size="12" fill="#777777">8 missions · host only</text><rect x="272" y="524" width="86" height="36" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="315" y="547" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Edit</text><rect x="20" y="584" width="350" height="94" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="599" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="615" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Non-host view hides Edit and Start and shows</tspan><tspan x="32" dy="16">&quot;Waiting for the host to start&quot;. Players see</tspan><tspan x="32" dy="16">nicknames only. When started, this screen becomes</tspan><tspan x="32" dy="16">the wallet.</tspan></text><rect x="20" y="712" width="350" height="48" rx="10" fill="#333333" stroke="#333333"/><text x="195" y="741" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start game</text><text x="195" y="784" font-size="12" fill="#777777" text-anchor="middle">Players can still join 