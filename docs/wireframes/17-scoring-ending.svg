<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Scoring and ending settings</title>
<desc id="desc">Failure points, negative score toggle, time limit, first-to-X score target and whether reaching it ends the game.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Scoring &amp; ending</text><rect x="324" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="347" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Done</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><text x="20" y="124" font-size="11" font-weight="700" fill="#777777">SCORING</text><text x="20" y="148" font-size="13" fill="#444444">Completed mission = +1 point</text><text x="20" y="178" font-size="14" font-weight="600" fill="#222222">Failed mission</text><rect x="20" y="188" width="350" height="36" rx="10" fill="#F4F4F4" stroke="#BBBBBB"/><rect x="23" y="191" width="169" height="30" rx="8" fill="#333333"/><text x="107.5" y="211" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">0 points</text><text x="282.5" y="211" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">-1 point</text><rect x="20" y="236" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="258" font-size="14" font-weight="600" fill="#222222">Allow negative scores</text><text x="34" y="276" font-size="12" fill="#777777">Only with -1. Off: scores stop at 0</text><rect x="312" y="249" width="46" height="26" rx="13" fill="#E6E6E6" stroke="#777777"/><circle cx="325" cy="262" r="10" fill="#FFFFFF" stroke="#777777"/><text x="20" y="314" font-size="11" font-weight="700" fill="#777777">ENDING</text><text x="20" y="336" font-size="12" fill="#777777">The host can always end the game.</text><rect x="20" y="348" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="370" font-size="14" font-weight="600" fill="#222222">Time limit</text><text x="34" y="388" font-size="12" fill="#777777">Ends at start + limit</text><text x="338" y="379" font-size="13" font-weight="600" fill="#444444" text-anchor="end">None</text><text x="356" y="380" font-size="20" fill="#222222" text-anchor="end">›</text><rect x="20" y="406" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="428" font-size="14" font-weight="600" fill="#222222">First to X points</text><text x="34" y="446" font-size="12" fill="#777777">Winner = first to reach X</text><text x="338" y="437" font-size="13" font-weight="600" fill="#444444" text-anchor="end">None</text><text x="356" y="438" font-size="20" fill="#222222" text-anchor="end">›</text><rect x="20" y="476" width="350" height="196" rx="12" fill="#F4F4F4" stroke="#999999" stroke-dasharray="6 4"/><rect x="32" y="488" width="170" height="18" rx="4" fill="#555555"/><text x="40" y="501" font-size="10" font-weight="700" fill="#FFFFFF">VARIANT: FIRST TO 10 SET</text><rect x="20" y="512" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="534" font-size="14" font-weight="600" fill="#222222">First to X points</text><text x="34" y="552" font-size="12" fill="#777777">Winner = first to reach X</text><rect x="246" y="522" width="112" height="32" rx="8" fill="#FFFFFF" stroke="#222222"/><line x1="280" y1="522" x2="280" y2="554" stroke="#BBBBBB"/><line x1="324" y1="522" x2="324" y2="554" stroke="#BBBBBB"/><text x="263" y="544" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">−</text><text x="302" y="543" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">10</text><text x="341" y="544" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">+</text><rect x="20" y="570" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="592" font-size="14" font-weight="600" fill="#222222">Reaching X ends the game</text><text x="34" y="610" font-size="12" fill="#777777">Off: play on until host or time</text><rect x="312" y="583" width="46" height="26" rx="13" fill="#333333" stroke="#333333"/><circle cx="345" cy="596" r="10" fill="#FFFFFF" stroke="#333333"/><text x="34" y="644" font-size="11" fill="#777777"><tspan x="34" dy="0">Lowering X to or below a current score triggers the</tspan><tspan x="34" dy="15">win at once.</tspan></text><rect x="20" y="688" width="350" height="94" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="703" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="719" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Time limit and first-to-X can change during play (a</tspan><tspan x="32" dy="16">new end time must be in the future). Failure points</tspan><tspan x="32" dy="16">and negative scores are locked once the game</tspan><tspan x="32" dy="16">starts.</tspan></text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
</svg>
