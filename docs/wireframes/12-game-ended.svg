<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Game ended summary</title>
<desc id="desc">Ended game: end reason, final standings revealed with nicknames, own results, sync window, and opt-in full pack save. Also used for past-game detail.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Beach day</text><rect x="324" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="347" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Chat</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><rect x="20" y="110" width="350" height="54" rx="10" fill="#F4F4F4" stroke="#BBBBBB"/><text x="34" y="133" font-size="15" font-weight="700" fill="#222222">Lee reached 10 points · ended 12 Oct</text><text x="34" y="152" font-size="12" fill="#444444">Results can sync for 6 more days, then stay only on this device.</text><text x="20" y="190" font-size="11" font-weight="700" fill="#777777">FINAL LEADERBOARD · NAMES REVEALED</text><rect x="20" y="200" width="350" height="38" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="44" cy="219" r="12" fill="none" stroke="#222222"/><text x="44" y="223" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">1</text><text x="68" y="224" font-size="14" font-weight="500" fill="#222222">Lee · was CheeryTiger42</text><text x="356" y="224" font-size="14" font-weight="700" fill="#222222" text-anchor="end">10</text><rect x="20" y="244" width="350" height="38" rx="10" fill="#E6E6E6" stroke="#222222" stroke-width="2"/><circle cx="44" cy="263" r="12" fill="none" stroke="#222222"/><text x="44" y="267" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">2</text><text x="68" y="268" font-size="14" font-weight="700" fill="#222222">Sam (you) · was RustyFalcon17</text><text x="356" y="268" font-size="14" font-weight="700" fill="#222222" text-anchor="end">7</text><rect x="20" y="288" width="350" height="38" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><circle cx="44" cy="307" r="12" fill="none" stroke="#222222"/><text x="44" y="311" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">3</text><text x="68" y="312" font-size="14" font-weight="500" fill="#222222">Ari · was SunnyDolphin83</text><text x="356" y="312" font-size="14" font-weight="700" fill="#222222" text-anchor="end">5</text><text x="195" y="344" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">See all 7 players</text><text x="20" y="372" font-size="11" font-weight="700" fill="#777777">YOUR MISSIONS</text><rect x="20" y="382" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="401" font-size="10" font-weight="700" fill="#777777">COMPLETED · GOT LEE</text><text x="34" y="419" font-size="13" fill="#222222">Get someone to dab</text><rect x="20" y="436" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="455" font-size="10" font-weight="700" fill="#777777">COMPLETED · GOT GROUP</text><text x="34" y="473" font-size="13" fill="#222222">Start a congo line (min 3 people)</text><rect x="20" y="490" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="509" font-size="10" font-weight="700" fill="#777777">FAILED</text><text x="34" y="527" font-size="13" fill="#222222">Get someone to beatbox for 5 seconds</text><rect x="20" y="552" width="350" height="148" rx="12" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="36" y="580" font-size="16" font-weight="700" fill="#222222">Save this pack?</text><text x="36" y="602" font-size="12" fill="#444444"><tspan x="36" dy="0">Keep a private copy of all 12 missions for future</tspan><tspan x="36" dy="16">games. Saving shows you the full list, but never</tspan><tspan x="36" dy="16">who had which mission.</tspan></text><rect x="36" y="648" width="150" height="38" rx="10" fill="#333333" stroke="#333333"/><text x="111" y="672" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Save pack</text><rect x="198" y="648" width="156" height="38" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="276" y="672" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Not now</text><rect x="20" y="716" width="350" height="94" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="731" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="747" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Other end reasons: &quot;Time's up&quot; and &quot;Host ended the</tspan><tspan x="32" dy="16">game&quot;. Past games on Home reopen this from device</tspan><tspan x="32" dy="16">history. Saving and syncing end after 7 days;</tspan><tspan x="32" dy="16">missing final results show &quot;Incomplete results&quot;.</tspan></text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
</svg>
