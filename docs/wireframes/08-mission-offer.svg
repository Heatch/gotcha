<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Mission offer selection</title>
<desc id="desc">Choose one of up to two offered missions for an empty slot, with one-left and pool-exhausted variants.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Pick a mission</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><text x="20" y="132" font-size="14" fill="#444444">Slot 4 · choose one. The other returns to the pool.</text><rect x="20" y="150" width="350" height="148" rx="14" fill="#FFFFFF" stroke="#222222"/><text x="36" y="176" font-size="11" font-weight="700" fill="#777777">OPTION A</text><text x="36" y="206" font-size="18" font-weight="700" fill="#222222"><tspan x="36" dy="0">Get someone to sing Wheels on the</tspan><tspan x="36" dy="24">Bus</tspan></text><rect x="36" y="242" width="318" height="40" rx="10" fill="#333333" stroke="#333333"/><text x="195" y="267" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Choose this mission</text><rect x="20" y="310" width="350" height="148" rx="14" fill="#FFFFFF" stroke="#222222"/><text x="36" y="336" font-size="11" font-weight="700" fill="#777777">OPTION B</text><text x="36" y="366" font-size="18" font-weight="700" fill="#222222"><tspan x="36" dy="0">Get someone to whisper anything</tspan><tspan x="36" dy="24">in your ear</tspan></text><rect x="36" y="402" width="318" height="40" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="195" y="427" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Choose this mission</text><rect x="20" y="480" width="170" height="230" rx="12" fill="#F4F4F4" stroke="#999999" stroke-dasharray="6 4"/><rect x="32" y="492" width="125" height="18" rx="4" fill="#555555"/><text x="40" y="505" font-size="10" font-weight="700" fill="#FFFFFF">VARIANT: ONE LEFT</text><rect x="32" y="512" width="146" height="132" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="44" y="538" font-size="13" font-weight="700" fill="#222222"><tspan x="44" dy="0">Get someone to</tspan><tspan x="44" dy="18">beatbox for 5</tspan><tspan x="44" dy="18">seconds</tspan></text><rect x="44" y="596" width="122" height="34" rx="10" fill="#333333" stroke="#333333"/><text x="105" y="618" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Choose</text><text x="32" y="668" font-size="11" fill="#777777">Last mission in the pack.</text><rect x="200" y="480" width="170" height="230" rx="12" fill="#F4F4F4" stroke="#999999" stroke-dasharray="6 4"/><rect x="212" y="492" width="131" height="18" rx="4" fill="#555555"/><text x="220" y="505" font-size="10" font-weight="700" fill="#FFFFFF">VARIANT: EXHAUSTED</text><text x="212" y="534" font-size="14" font-weight="700" fill="#222222">No missions left</text><text x="212" y="556" font-size="12" fill="#444444"><tspan x="212" dy="0">Every mission in this</tspan><tspan x="212" dy="16">pack has been handed</tspan><tspan x="212" dy="16">out. Empty slots stay</tspan><tspan x="212" dy="16">empty; keep playing</tspan><tspan x="212" dy="16">the ones you have.</tspan></text><rect x="212" y="662" width="146" height="34" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="285" y="684" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Back to wallet</text><rect x="20" y="726" width="350" height="78" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="741" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="757" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Offers are not reserved. If another player claims</tspan><tspan x="32" dy="16">an option first, show &quot;That mission was just taken&quot;</tspan><tspan x="32" dy="16">and refresh the offer.</tspan></text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
</svg>
