<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Rules and help</title>
<desc id="desc">How to play plus this game's actual settings, reachable from home, lobby and wallet.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">How to play</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><text x="20" y="124" font-size="12" fill="#777777" font-style="italic">Numbers below are this game's settings.</text><text x="20" y="154" font-size="15" font-weight="700" fill="#222222">Goal</text><text x="20" y="174" font-size="13" fill="#444444"><tspan x="20" dy="0">Get other players to do the thing on your secret</tspan><tspan x="20" dy="18">mission without them realising.</tspan></text><text x="20" y="228" font-size="15" font-weight="700" fill="#222222">Slots</text><text x="20" y="248" font-size="13" fill="#444444"><tspan x="20" dy="0">You hold up to 5 missions. Pick one of 2 offered</tspan><tspan x="20" dy="18">missions to fill a slot.</tspan></text><text x="20" y="302" font-size="15" font-weight="700" fill="#222222">Success</text><text x="20" y="322" font-size="13" fill="#444444"><tspan x="20" dy="0">Mark who you got (or Group, if the mission allows</tspan><tspan x="20" dy="18">it). Get everyone once before repeating someone.</tspan></text><text x="20" y="376" font-size="15" font-weight="700" fill="#222222">Failure</text><text x="20" y="396" font-size="13" fill="#444444"><tspan x="20" dy="0">Called out or it did not work? Mark it failed (0</tspan><tspan x="20" dy="18">points). Results cannot be undone.</tspan></text><text x="20" y="450" font-size="15" font-weight="700" fill="#222222">Cooldowns</text><text x="20" y="470" font-size="13" fill="#444444"><tspan x="20" dy="0">Each result empties its slot for a while: 5, 10,</tspan><tspan x="20" dy="18">20 min and so on, up to 6 hours.</tspan></text><text x="20" y="524" font-size="15" font-weight="700" fill="#222222">Scores</text><text x="20" y="544" font-size="13" fill="#444444"><tspan x="20" dy="0">One point per completed mission. The leaderboard</tspan><tspan x="20" dy="18">uses anonymous names until the end.</tspan></text><text x="20" y="598" font-size="15" font-weight="700" fill="#222222">Secrets</text><text x="20" y="618" font-size="13" fill="#444444"><tspan x="20" dy="0">Never show your missions. Each mission is handed</tspan><tspan x="20" dy="18">out only once per game.</tspan></text><text x="20" y="672" font-size="15" font-weight="700" fill="#222222">Ending</text><text x="20" y="692" font-size="13" fill="#444444"><tspan x="20" dy="0">The host ends the game. Results stay available to</tspan><tspan x="20" dy="18">sync for 7 days.</tspan></text><rect x="20" y="746" width="350" height="40" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="195" y="771" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">View all game settings</text><text x="195" y="810" font-size="12" fill="#777777" text-anchor="middle" font-style="italic">Honour system: play fair to keep it fun.</text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
</svg>
