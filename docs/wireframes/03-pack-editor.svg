<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Pack editor</title>
<desc id="desc">Host-only editor for the game draft pack or a private saved pack: title, description, ordered missions.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Edit pack</text><rect x="324" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="347" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Done</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><text x="20" y="124" font-size="12" font-weight="600" fill="#777777">PACK TITLE</text><rect x="20" y="132" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="159" font-size="15" fill="#222222">Example social pack</text><text x="20" y="196" font-size="12" font-weight="600" fill="#777777">DESCRIPTION</text><rect x="20" y="204" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="231" font-size="15" fill="#222222">Party missions for mixed groups</text><text x="20" y="282" font-size="11" font-weight="700" fill="#777777">MISSIONS (8)</text><rect x="290" y="264" width="80" height="30" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="330" y="284" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">+ Add</text><rect x="20" y="296" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="32" y="323" font-size="14" font-weight="700" fill="#777777">::</text><text x="52" y="323" font-size="13" font-weight="700" fill="#222222">1.</text><text x="74" y="323" font-size="13" fill="#222222">Get someone to compliment your hair</text><text x="356" y="323" font-size="12" font-weight="600" fill="#222222" text-anchor="end">Edit</text><rect x="20" y="346" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="32" y="373" font-size="14" font-weight="700" fill="#777777">::</text><text x="52" y="373" font-size="13" font-weight="700" fill="#222222">2.</text><text x="74" y="373" font-size="13" fill="#222222">Get someone to dab</text><text x="356" y="373" font-size="12" font-weight="600" fill="#222222" text-anchor="end">Edit</text><rect x="20" y="396" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="32" y="423" font-size="14" font-weight="700" fill="#777777">::</text><text x="52" y="423" font-size="13" font-weight="700" fill="#222222">3.</text><text x="74" y="423" font-size="13" fill="#222222">Make someone say moist in a sentence</text><text x="356" y="423" font-size="12" font-weight="600" fill="#222222" text-anchor="end">Edit</text><rect x="20" y="446" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="32" y="473" font-size="14" font-weight="700" fill="#777777">::</text><text x="52" y="473" font-size="13" font-weight="700" fill="#222222">4.</text><text x="74" y="473" font-size="13" fill="#222222">Start a congo line (min 3 people)</text><text x="356" y="473" font-size="12" font-weight="600" fill="#222222" text-anchor="end">Edit</text><rect x="20" y="496" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="32" y="523" font-size="14" font-weight="700" fill="#777777">::</text><text x="52" y="523" font-size="13" font-weight="700" fill="#222222">5.</text><text x="74" y="523" font-size="13" fill="#222222">Get someone to tell you their star sign</text><text x="356" y="523" font-size="12" font-weight="600" fill="#222222" text-anchor="end">Edit</text><rect x="20" y="546" width="350" height="44" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="32" y="573" font-size="14" font-weight="700" fill="#777777">::</text><text x="52" y="573" font-size="13" font-weight="700" fill="#222222">6.</text><text x="74" y="573" font-size="13" fill="#222222">Get someone to sing Wheels on the Bus</text><text x="356" y="573" font-size="12" font-weight="600" fill="#222222" text-anchor="end">Edit</text><text x="195" y="610" font-size="12" fill="#777777" text-anchor="middle">+ 2 more missions</text><rect x="20" y="624" width="350" height="94" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="639" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="655" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Host only. Other players never see this list during</tspan><tspan x="32" dy="16">the game. Starting freezes a snapshot; later edits</tspan><tspan x="32" dy="16">do not change that game. Swipe or long-press a row</tspan><tspan x="32" dy="16">to delete; drag :: to reorder.</tspan></text><rect x="20" y="732" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="195" y="759" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Save copy to My packs</text><text x="195" y="798" font-size="12" fill="#777777" text-anchor="middle">Optional. Keeps a private copy on this device for future games.</text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
</svg>
