<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Friday party</text><rect x="324" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="347" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">...</text><rect x="267" y="56" width="51" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="292.5" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Rules</text><rect x="215" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="238" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Chat</text><rect x="158" y="56" width="51" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="183.5" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Board</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><rect x="20" y="110" width="350" height="40" rx="8" fill="#F4F4F4"/><rect x="20" y="176" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><rect x="20" y="256" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><rect x="20" y="336" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><rect x="0" y="0" width="390" height="844" fill="#000000" opacity="0.35"/><rect x="0" y="214" width="390" height="654" rx="18" fill="#FFFFFF"/><rect x="175" y="222" width="40" height="5" rx="2" fill="#CCCCCC"/><text x="20" y="258" font-size="19" font-weight="700" fill="#222222">Resolve mission</text><text x="370" y="258" font-size="14" font-weight="600" fill="#222222" text-anchor="end">Close</text><rect x="20" y="274" width="350" height="50" rx="10" fill="#F4F4F4" stroke="#BBBBBB"/><text x="34" y="304" font-size="14" font-weight="600" fill="#222222">Get someone to tell you their star sign</text><rect x="20" y="338" width="350" height="36" rx="10" fill="#F4F4F4" stroke="#BBBBBB"/><rect x="23" y="341" width="169" height="30" rx="8" fill="#333333"/><text x="107.5" y="361" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Success</text><text x="282.5" y="361" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Fail</text><text x="20" y="404" font-size="14" font-weight="700" fill="#222222">Who did you get?</text><rect x="20" y="416" width="66" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="53" y="438" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Group</text><rect x="94" y="416" width="51" height="34" rx="17" fill="#333333" stroke="#333333"/><text x="119.5" y="438" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lee</text><rect x="153" y="416" width="96" height="34" rx="17" fill="#FFFFFF" stroke="#BBBBBB" stroke-dasharray="4 3"/><text x="201" y="438" font-size="13" font-weight="600" fill="#777777" text-anchor="middle">Ari · got</text><rect x="257" y="416" width="43" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="278.5" y="438" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Jo</text><rect x="20" y="460" width="96" height="34" rx="17" fill="#FFFFFF" stroke="#BBBBBB" stroke-dasharray="4 3"/><text x="68" y="482" font-size="13" font-weight="600" fill="#777777" text-anchor="middle">Max · got</text><rect x="124" y="460" width="51" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="149.5" y="482" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Kim</text><text x="20" y="520" font-size="12" fill="#777777">Get everyone once before repeating. Group always OK.</text><text x="20" y="556" font-size="12" font-weight="600" fill="#777777">HOW DID YOU PULL IT OFF? (OPTIONAL)</text><rect x="20" y="564" width="350" height="56" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="597" font-size="15" fill="#222222">Asked what we should all get matching...</text><text x="20" y="650" font-size="12" font-weight="700" fill="#222222">This cannot be undone. The slot starts its cooldown.</text><rect x="20" y="666" width="120" height="46" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="80" y="694" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Cancel</text><rect x="152" y="666" width="218" height="46" rx="10" fill="#333333" stroke="#333333"/><text x="261" y="694" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Confirm success</text><rect x="20" y="728" width="350" height="78" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="743" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="759" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Fail hides target and comment and shows &quot;Confirm</tspan><tspan x="32" dy="16">fail&quot;. Both outcomes post a result to chat and move</tspan><tspan x="32" dy="16">the card to wallet history.</tspan></text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
