<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Resolve mission sheet</title>
<desc id="desc">Bottom sheet from a wallet card: success with target (Group or player) and optional comment, or failure; irreversible.</desc>
