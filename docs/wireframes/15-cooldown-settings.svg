<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Cooldown settings</title>
<desc id="desc">Cooldown base time, scaling (fixed, multiply, add), multiplier or step, cap, failure toggle, sequence preview and cooldowns-off variant.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Cooldowns</text><rect x="324" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="347" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Done</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><rect x="20" y="112" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="134" font-size="14" font-weight="600" fill="#222222">Base time</text><text x="34" y="152" font-size="12" fill="#777777">0 turns cooldowns off</text><rect x="246" y="122" width="112" height="32" rx="8" fill="#FFFFFF" stroke="#222222"/><line x1="280" y1="122" x2="280" y2="154" stroke="#BBBBBB"/><line x1="324" y1="122" x2="324" y2="154" stroke="#BBBBBB"/><text x="263" y="144" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">−</text><text x="302" y="143" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">5 min</text><text x="341" y="144" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">+</text><text x="20" y="186" font-size="11" font-weight="700" fill="#777777">SCALING</text><rect x="20" y="196" width="350" height="36" rx="10" fill="#F4F4F4" stroke="#BBBBBB"/><text x="78.33333333333334" y="219" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Fixed</text><rect x="139.66666666666669" y="199" width="110.66666666666667" height="30" rx="8" fill="#333333"/><text x="195.00000000000003" y="219" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Multiply</text><text x="311.6666666666667" y="219" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Add</text><rect x="20" y="244" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="266" font-size="14" font-weight="600" fill="#222222">Multiplier</text><text x="34" y="284" font-size="12" fill="#777777">Each result multiplies the wait</text><rect x="246" y="254" width="112" height="32" rx="8" fill="#FFFFFF" stroke="#222222"/><line x1="280" y1="254" x2="280" y2="286" stroke="#BBBBBB"/><line x1="324" y1="254" x2="324" y2="286" stroke="#BBBBBB"/><text x="263" y="276" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">−</text><text x="302" y="275" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">x2</text><text x="341" y="276" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">+</text><text x="20" y="314" font-size="12" fill="#777777">Add shows Step (default 5 min) instead. Fixed hides both.</text><rect x="20" y="326" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="348" font-size="14" font-weight="600" fill="#222222">Cap</text><text x="34" y="366" font-size="12" fill="#777777">Longest single wait (or none)</text><rect x="246" y="336" width="112" height="32" rx="8" fill="#FFFFFF" stroke="#222222"/><line x1="280" y1="336" x2="280" y2="368" stroke="#BBBBBB"/><line x1="324" y1="336" x2="324" y2="368" stroke="#BBBBBB"/><text x="263" y="358" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">−</text><text x="302" y="357" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">6 h</text><text x="341" y="358" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">+</text><rect x="20" y="384" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="406" font-size="14" font-weight="600" fill="#222222">Failures advance cooldown</text><text x="34" y="424" font-size="12" fill="#777777">Off: only successes count</text><rect x="312" y="397" width="46" height="26" rx="13" fill="#333333" stroke="#333333"/><circle cx="345" cy="410" r="10" fill="#FFFFFF" stroke="#333333"/><text x="20" y="458" font-size="11" font-weight="700" fill="#777777">PREVIEW · WAIT AFTER EACH RESULT</text><rect x="20" y="468" width="43" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="41.5" y="490" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">5m</text><rect x="71" y="468" width="51" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="96.5" y="490" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">10m</text><rect x="130" y="468" width="51" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="155.5" y="490" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">20m</text><rect x="189" y="468" width="51" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="214.5" y="490" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">40m</text><rect x="248" y="468" width="73" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="284.5" y="490" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">1h 20m</text><rect x="20" y="512" width="73" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="56.5" y="534" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">2h 40m</text><rect x="101" y="512" width="73" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="137.5" y="534" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">5h 20m</text><rect x="182" y="512" width="43" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="203.5" y="534" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">6h</text><rect x="233" y="512" width="43" height="34" rx="17" fill="#FFFFFF" stroke="#222222"/><text x="254.5" y="534" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">6h</text><text x="20" y="572" font-size="12" fill="#444444"><tspan x="20" dy="0">Several slots can cool down at once; every result moves</tspan><tspan x="20" dy="16">you to the next wait.</tspan></text><rect x="20" y="606" width="350" height="112" rx="12" fill="#F4F4F4" stroke="#999999" stroke-dasharray="6 4"/><rect x="32" y="618" width="157" height="18" rx="4" fill="#555555"/><text x="40" y="631" font-size="10" font-weight="700" fill="#FFFFFF">VARIANT: COOLDOWNS OFF</text><rect x="20" y="642" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="664" font-size="14" font-weight="600" fill="#222222">Base time</text><text x="34" y="682" font-size="12" fill="#777777">Slots refill immediately</text><rect x="246" y="652" width="112" height="32" rx="8" fill="#FFFFFF" stroke="#222222"/><line x1="280" y1="652" x2="280" y2="684" stroke="#BBBBBB"/><line x1="324" y1="652" x2="324" y2="684" stroke="#BBBBBB"/><text x="263" y="674" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">−</text><text x="302" y="673" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">Off</text><text x="341" y="674" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">+</text><text x="34" y="710" font-size="11" fill="#777777">Scaling, cap and preview are hidden.</text><rect x="20" y="732" width="350" height="78" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="747" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="763" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Editable during play by the host. Only cooldowns</tspan><tspan x="32" dy="16">started after the change use the new times; the</tspan><tspan x="32" dy="16">change is posted to chat.</tspan></text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
