<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Leaderboard and chat settings</title>
<desc id="desc">Leaderboard mode, player chat, result post style and names, with the irreversible switch-to-nicknames warning variant.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Leaderboard &amp; chat</text><rect x="324" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="347" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Done</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><text x="20" y="124" font-size="11" font-weight="700" fill="#777777">LEADERBOARD DURING PLAY</text><rect x="20" y="134" width="350" height="36" rx="10" fill="#F4F4F4" stroke="#BBBBBB"/><text x="78.33333333333334" y="157" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Off</text><rect x="139.66666666666669" y="137" width="110.66666666666667" height="30" rx="8" fill="#333333"/><text x="195.00000000000003" y="157" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Anonymous</text><text x="311.6666666666667" y="157" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Nicknames</text><text x="20" y="192" font-size="12" fill="#777777"><tspan x="20" dy="0">Full standings with nicknames are always revealed when</tspan><tspan x="20" dy="16">the game ends.</tspan></text><text x="20" y="236" font-size="11" font-weight="700" fill="#777777">CHAT</text><rect x="20" y="246" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="268" font-size="14" font-weight="600" fill="#222222">Player chat</text><text x="34" y="286" font-size="12" fill="#777777">Off: read-only feed of results</text><rect x="312" y="259" width="46" height="26" rx="13" fill="#333333" stroke="#333333"/><circle cx="345" cy="272" r="10" fill="#FFFFFF" stroke="#333333"/><text x="20" y="324" font-size="14" font-weight="600" fill="#222222">Result posts</text><rect x="20" y="334" width="350" height="36" rx="10" fill="#F4F4F4" stroke="#BBBBBB"/><rect x="23" y="337" width="110.66666666666667" height="30" rx="8" fill="#333333"/><text x="78.33333333333334" y="357" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Full mission</text><text x="195.00000000000003" y="357" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Generic</text><text x="311.6666666666667" y="357" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Off</text><text x="20" y="390" font-size="12" fill="#777777"><tspan x="20" dy="0">Generic: &quot;CheeryTiger42 completed a mission&quot;. Locked</tspan><tspan x="20" dy="16">once started.</tspan></text><rect x="20" y="420" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="442" font-size="14" font-weight="600" fill="#222222">Names in result posts</text><text x="34" y="460" font-size="12" fill="#777777">Used when the leaderboard is off</text><text x="338" y="451" font-size="13" font-weight="600" fill="#444444" text-anchor="end">Aliases</text><text x="356" y="452" font-size="20" fill="#222222" text-anchor="end">›</text><text x="20" y="494" font-size="12" fill="#777777">Otherwise posts follow the leaderboard names.</text><rect x="20" y="516" width="350" height="204" rx="12" fill="#F4F4F4" stroke="#999999" stroke-dasharray="6 4"/><rect x="32" y="528" width="246" height="18" rx="4" fill="#555555"/><text x="40" y="541" font-size="10" font-weight="700" fill="#FFFFFF">VARIANT: SWITCH TO NICKNAMES IN PLAY</text><rect x="40" y="546" width="310" height="160" rx="12" fill="#FFFFFF" stroke="#222222"/><text x="56" y="574" font-size="16" font-weight="700" fill="#222222">Show real names?</text><text x="56" y="596" font-size="12" fill="#444444"><tspan x="56" dy="0">Everyone will see who is behind each alias,</tspan><tspan x="56" dy="16">including earlier result posts. Phones that</tspan><tspan x="56" dy="16">already loaded names keep them.</tspan></text><rect x="56" y="656" width="130" height="36" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="121" y="679" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Cancel</text><rect x="198" y="656" width="136" height="36" rx="10" fill="#333333" stroke="#333333"/><text x="266" y="679" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Show names</text><rect x="20" y="736" width="350" height="78" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="751" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="767" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Leaderboard mode, player chat and post names can</tspan><tspan x="32" dy="16">change during play and are announced in chat. With</tspan><tspan x="32" dy="16">chat and result posts both off, Chat is hidden.</tspan></text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
</svg>
