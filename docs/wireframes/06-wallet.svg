2222"/><text x="320" y="227" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Resolve</text><rect x="20" y="266" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="34" y="286" font-size="10" font-weight="700" fill="#777777">SLOT 2</text><text x="34" y="306" font-size="14" font-weight="600" fill="#222222"><tspan x="34" dy="0">Get someone to beatbox for 5</tspan><tspan x="34" dy="19">seconds</tspan></text><rect x="282" y="284" width="76" height="36" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="320" y="307" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Resolve</text><rect x="20" y="346" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="34" y="366" font-size="10" font-weight="700" fill="#777777">SLOT 3</text><text x="34" y="386" font-size="14" font-weight="600" fill="#222222"><tspan x="34" dy="0">Make someone say moist in a</tspan><tspan x="34" dy="19">sentence</tspan></text><rect x="282" y="364" width="76" height="36" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="320" y="387" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Resolve</text><rect x="20" y="426" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#222222" stroke-dasharray="6 4"/><text x="34" y="446" font-size="10" font-weight="700" fill="#777777">SLOT 4 · EMPTY</text><text x="34" y="472" font-size="15" font-weight="600" fill="#222222">New mission ready</text><rect x="282" y="444" width="76" height="36" rx="10" fill="#333333" stroke="#333333"/><text x="320" y="467" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pick</text><rect x="20" y="506" width="350" height="72" rx="10" fill="#F4F4F4" stroke="#777777" stroke-dasharray="6 4"/><text x="34" y="526" font-size="10" font-weight="700" fill="#777777">SLOT 5 · COOLDOWN</text><text x="34" y="548" font-size="14" font-weight="600" fill="#444444">Next mission in 18m 40s</text><rect x="34" y="560" width="230" height="6" rx="3" fill="#DDDDDD"/><rect x="34" y="560" width="90" height="6" rx="3" fill="#777777"/><rect x="290" y="533" width="61" height="18" rx="4" fill="#555555"/><text x="298" y="546" font-size="10" font-weight="700" fill="#FFFFFF">VARIANT</text><text x="20" y="606" font-size="11" font-weight="700" fill="#777777">WALLET HISTORY</text><rect x="20" y="616" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="635" font-size="10" font-weight="700" fill="#777777">COMPLETED · GOT LEE</text><text x="34" y="653" font-size="13" fill="#222222">Get someone to dab</text><rect x="20" y="670" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="689" font-size="10" font-weight="700" fill="#777777">FAILED</text><text x="34" y="707" font-size="13" fill="#222222">Start a congo line (min 3 people)</text><rect x="20" y="730" width="350" height="78" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="745" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="761" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Resolve opens the resolution sheet. Board and Chat</tspan><tspan x="32" dy="16">open bottom sheets. &quot;...&quot; holds End game for the</tspan><tspan x="32" dy="16">host. Other players' missions are never shown.</tspan></text>
