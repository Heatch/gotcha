<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">Friday party</text><rect x="324" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="347" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">...</text><rect x="267" y="56" width="51" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="292.5" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Rules</text><rect x="215" y="56" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="238" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Chat</text><rect x="158" y="56" width="51" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="183.5" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">Board</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><rect x="20" y="110" width="350" height="40" rx="8" fill="#F4F4F4"/><rect x="20" y="176" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><rect x="20" y="256" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><rect x="20" y="336" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#BBBBBB"/><rect x="0" y="0" width="390" height="844" fill="#000000" opacity="0.35"/><rect x="0" y="130" width="390" height="738" rx="18" fill="#FFFFFF"/><rect x="175" y="138" width="40" height="5" rx="2" fill="#CCCCCC"/><text x="20" y="174" font-size="19" font-weight="700" fill="#222222">Chat</text><text x="370" y="174" font-size="14" font-weight="600" fill="#222222" text-anchor="end">Close</text><rect x="20" y="196" width="350" height="78" rx="10" fill="#F4F4F4" stroke="#BBBBBB" stroke-dasharray="4 3"/><text x="34" y="212" font-size="9" font-weight="700" fill="#777777">RESULT</text><text x="34" y="228" font-size="13" font-weight="600" fill="#222222"><tspan x="34" dy="0">Lee completed &quot;Get someone to dab&quot; and got</tspan><tspan x="34" dy="18">Ari.</tspan></text><text x="34" y="262" font-size="12" fill="#777777" font-style="italic">Comment: asked about dance crazes</text><rect x="20" y="286" width="220" height="53" rx="14" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="304" font-size="11" font-weight="700" fill="#777777">Jo</text><text x="34" y="322" font-size="14" fill="#222222">who got me earlier??</text><rect x="150" y="351" width="220" height="53" rx="14" fill="#E6E6E6" stroke="#222222"/><text x="164" y="369" font-size="11" font-weight="700" fill="#777777">Sam</text><text x="164" y="387" font-size="14" fill="#222222">not telling</text><rect x="20" y="416" width="350" height="62" rx="10" fill="#F4F4F4" stroke="#BBBBBB" stroke-dasharray="4 3"/><text x="34" y="432" font-size="9" font-weight="700" fill="#777777">RESULT</text><text x="34" y="448" font-size="13" font-weight="600" fill="#222222"><tspan x="34" dy="0">Ari failed &quot;Start a congo line (min 3</tspan><tspan x="34" dy="18">people)&quot;.</tspan></text><rect x="20" y="490" width="220" height="53" rx="14" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="508" font-size="11" font-weight="700" fill="#777777">Ari</text><text x="34" y="526" font-size="14" fill="#222222">nobody wanted to dance</text><rect x="20" y="646" width="350" height="78" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="661" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="677" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Members only; nicknames are shown here, not</tspan><tspan x="32" dy="16">aliases. Ended games replace the composer with</tspan><tspan x="32" dy="16">&quot;Chat is read-only&quot;.</tspan></text><line x1="0" y1="752" x2="390" y2="752" stroke="#BBBBBB"/><rect x="20" y="768" width="262" height="44" rx="22" fill="#FFFFFF" stroke="#BBBBBB"/><text x="38" y="795" font-size="14" fill="#777777">Message the group</text><rect x="292" y="768" width="78" height="44" rx="10" fill="#333333" stroke="#333333"/><text x="331" y="795" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Send</text>
