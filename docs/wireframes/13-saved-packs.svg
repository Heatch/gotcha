<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Gotcha wireframe: Saved packs</title>
<desc id="desc">Private saved packs on this device: use in a new game, edit, delete with confirmation.</desc>
<rect x="0" y="0" width="390" height="844" fill="#FFFFFF"/>
<text x="24" y="30" font-size="13" font-weight="600" fill="#222222">9:41</text><rect x="338" y="20" width="28" height="12" rx="3" fill="none" stroke="#222222"/><rect x="341" y="23" width="18" height="6" rx="1" fill="#222222"/><text x="18" y="80" font-size="30" fill="#222222">‹</text><text x="42" y="78" font-size="17" font-weight="700" fill="#222222">My packs</text><rect x="319" y="56" width="51" height="30" rx="8" fill="#FFFFFF" stroke="#222222"/><text x="344.5" y="76" font-size="12" font-weight="600" fill="#222222" text-anchor="middle">+ New</text><line x1="0" y1="98" x2="390" y2="98" stroke="#BBBBBB"/><text x="20" y="130" font-size="14" fill="#444444">Private packs saved on this device.</text><rect x="20" y="146" width="350" height="94" rx="12" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="172" font-size="15" font-weight="700" fill="#222222">Party classics (my edit)</text><text x="34" y="191" font-size="12" fill="#777777">40 missions · saved 2 Oct</text><rect x="34" y="200" width="72" height="30" rx="10" fill="#333333" stroke="#333333"/><text x="70" y="220" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Use</text><rect x="114" y="200" width="64" height="30" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="146" y="220" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Edit</text><rect x="186" y="200" width="76" height="30" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="224" y="220" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Delete</text><rect x="20" y="250" width="350" height="94" rx="12" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="276" font-size="15" font-weight="700" fill="#222222">Beach day pack</text><text x="34" y="295" font-size="12" fill="#777777">12 missions · saved after game 12 Oct</text><rect x="34" y="304" width="72" height="30" rx="10" fill="#333333" stroke="#333333"/><text x="70" y="324" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Use</text><rect x="114" y="304" width="64" height="30" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="146" y="324" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Edit</text><rect x="186" y="304" width="76" height="30" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="224" y="324" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Delete</text><rect x="20" y="354" width="350" height="94" rx="12" fill="#FFFFFF" stroke="#BBBBBB"/><text x="34" y="380" font-size="15" font-weight="700" fill="#222222">Office safe</text><text x="34" y="399" font-size="12" fill="#777777">30 missions · saved 20 Sep</text><rect x="34" y="408" width="72" height="30" rx="10" fill="#333333" stroke="#333333"/><text x="70" y="428" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Use</text><rect x="114" y="408" width="64" height="30" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="146" y="428" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Edit</text><rect x="186" y="408" width="76" height="30" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="224" y="428" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Delete</text><rect x="20" y="466" width="350" height="184" rx="12" fill="#F4F4F4" stroke="#999999" stroke-dasharray="6 4"/><rect x="32" y="478" width="195" height="18" rx="4" fill="#555555"/><text x="40" y="491" font-size="10" font-weight="700" fill="#FFFFFF">VARIANT: DELETE CONFIRMATION</text><rect x="40" y="496" width="310" height="140" rx="12" fill="#FFFFFF" stroke="#222222"/><text x="56" y="524" font-size="16" font-weight="700" fill="#222222">Delete &quot;Office safe&quot;?</text><text x="56" y="546" font-size="12" fill="#444444"><tspan x="56" dy="0">Games that already used it keep their own</tspan><tspan x="56" dy="16">copy. This cannot be undone.</tspan></text><rect x="56" y="588" width="130" height="36" rx="10" fill="#FFFFFF" stroke="#222222"/><text x="121" y="611" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Cancel</text><rect x="198" y="588" width="136" height="36" rx="10" fill="#333333" stroke="#333333"/><text x="266" y="611" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Delete</text><rect x="20" y="666" width="350" height="94" rx="6" fill="#FAFAFA" stroke="#999999" stroke-dasharray="5 4"/><text x="32" y="681" font-size="9" font-weight="700" fill="#777777">WIREFRAME NOTE</text><text x="32" y="697" font-size="12" fill="#777777" font-style="italic"><tspan x="32" dy="0">Each pack is controlled by a secret key kept on</tspan><tspan x="32" dy="16">this device. Clearing app data or losing the phone</tspan><tspan x="32" dy="16">loses access; there is no account recovery. Use</tspan><tspan x="32" dy="16">starts Create game with a copy of the pack.</tspan></text>
<rect x="0.5" y="0.5" width="389" height="843" rx="24" fill="none" stroke="#999999"/>
